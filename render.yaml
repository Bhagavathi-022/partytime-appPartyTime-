# One-click deploy on Render (render.com): New > Blueprint > pick this repo.
services:
  - type: web
    name: partytime
    runtime: node
    plan: free
    buildCommand: "echo no build step"
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: TMDB_API_KEY
        sync: false
      - key: OMDB_API_KEY
        sync: false
